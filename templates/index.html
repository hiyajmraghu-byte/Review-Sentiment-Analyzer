<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Review Sentiment Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            resize: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            background: #f1f1f1;
        }

        .positive {
            color: green;
            font-size: 24px;
            font-weight: bold;
        }

        .negative {
            color: red;
            font-size: 24px;
            font-weight: bold;
        }

        .confidence {
            margin-top: 10px;
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Review Sentiment Analyzer</h1>

    <p class="subtitle">
        Enter a movie review and let the AI predict its sentiment.
    </p>

    <form method="POST">

        <textarea
            name="review"
            placeholder="Write your movie review here..."
            required
        >{{ review }}</textarea>

        <button type="submit">
            Analyze Sentiment
        </button>

    </form>

    {% if sentiment %}

    <div class="result">

        {% if sentiment == "Positive" %}

            <div class="positive">
                😊 Positive
            </div>

        {% else %}

            <div class="negative">
                😞 Negative
            </div>

        {% endif %}

        <div class="confidence">
            Confidence: {{ confidence }}%
        </div>

    </div>

    {% endif %}

</div>

</body>
</html>
